<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><title>時間相機</title>
<style>
:root{--ac:#ffb020;--glass:rgba(22,24,30,.62);--line:rgba(255,255,255,.12);--ff:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:var(--ff);overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;background:#000}
#stage video,#stage img{position:absolute;inset:0;width:100%;height:100%}
#v{object-fit:cover}#shot,#pb{object-fit:contain;opacity:0;transition:opacity .3s}
#ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .3s}
.hidden{opacity:0!important;pointer-events:none!important}
header{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(rgba(0,0,0,.55),transparent);transition:opacity .3s}
.chip{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:7px 12px;border-radius:20px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.rec{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;font:600 15px var(--ff);font-variant-numeric:tabular-nums;background:#e5342b;padding:5px 12px;border-radius:8px;transition:opacity .2s}
.rec i{width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
#ctrl{position:fixed;left:0;right:0;bottom:0;padding:14px 0 calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(transparent,rgba(0,0,0,.7) 40%);transition:opacity .3s,transform .3s}
.seg{display:flex;justify-content:center;gap:4px;margin:0 auto 14px;width:max-content;padding:3px;border-radius:18px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.seg button{border:0;background:none;color:rgba(255,255,255,.7);font:600 14px var(--ff);letter-spacing:.1em;padding:7px 18px;border-radius:15px;transition:all .25s}
.seg button.on{background:rgba(255,255,255,.16);color:var(--ac)}
.row{display:flex;justify-content:space-around;align-items:center;padding:0 24px}
.ib{width:50px;height:50px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .15s}
.ib:active,.shutter:active{transform:scale(.9)}.ib svg{width:24px;height:24px}
.shutter{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:none;padding:0;display:grid;place-items:center;transition:transform .15s}
.shutter span{width:62px;height:62px;border-radius:50%;background:#fff;transition:all .3s}
.video .shutter span{background:#e5342b}.recording .shutter span{width:30px;height:30px;border-radius:8px}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);padding:10px 18px 18px;border-radius:26px;background:var(--glass);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);border:1px solid var(--line);transform:translateY(calc(100% + 30px));transition:transform .38s cubic-bezier(.2,.9,.3,1)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 12px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sh b{font-size:17px}
.done{border:0;background:var(--ac);color:#111;font:700 15px var(--ff);padding:7px 18px;border-radius:16px}
.fl{display:block;margin-top:10px}.fl span{display:block;font-size:12px;color:rgba(255,255,255,.55);margin:0 0 5px 4px;letter-spacing:.05em}
.fl input{width:100%;font:16px var(--ff);color:#fff;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);outline:none;transition:border .2s}
.fl input:focus{border-color:var(--ac)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#result{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;padding:16px 20px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(transparent,rgba(0,0,0,.8) 40%);transition:opacity .3s}
#result button{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;height:52px;border-radius:26px;border:0;font:600 16px var(--ff)}
#result svg{width:20px;height:20px}#back{background:var(--glass);color:#fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}#save{background:var(--ac);color:#111}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 16px;border-radius:18px;font-size:14px;transition:opacity .3s}
#file{display:none}
</style></head><body class="photo">
<div id="stage"><video id="v" autoplay playsinline muted></video><img id="shot" alt=""><video id="pb" controls playsinline></video></div>
<canvas id="ov"></canvas>
<header id="top"><div class="chip"><i></i><span id="siteChip"></span></div><div id="rec" class="rec hidden"><i></i><span id="rt">00:00</span></div><span style="width:40px"></span></header>
<div id="ctrl"><div class="seg"><button id="mPhoto" class="on">照片</button><button id="mVideo">錄影</button></div>
<div class="row"><button id="pick" class="ib" aria-label="選相片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></button>
<button id="snap" class="shutter" aria-label="拍攝"><span></span></button>
<button id="fieldsBtn" class="ib" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button></div></div>
<div id="sheet" class="sheet"><div class="grab"></div><div class="sh"><b>浮水印資訊</b><button class="done" id="done">完成</button></div>
<label class="fl"><span>公司／社宅名稱</span><input id="site" placeholder="中和安邦社宅"></label>
<label class="fl"><span>案號</span><input id="case" placeholder="例：A-1023"></label>
<div class="two"><label class="fl"><span>棟別</span><input id="bld" placeholder="例：B棟"></label><label class="fl"><span>樓層</span><input id="flr" placeholder="例：5F"></label></div>
<label class="fl"><span>備註</span><input id="note" placeholder="例：浴室漏水"></label></div>
<div id="result" class="hidden"><button id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>重拍</button><button id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>儲存</button></div>
<div id="flash"></div><div id="toast" class="hidden"></div>
<input type="file" id="file" accept="image/*" capture="environment"><canvas id="c" style="display:none"></canvas>
<script src="app.js"></script></body></html>
